name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Lets the workflow be started by hand from the Actions tab, so a
  # run can be retried without a new commit.
  workflow_dispatch:

jobs:
  test:
    # Runs on an Instabox machine instead of a GitHub-hosted runner,
    # so the job uses no GitHub Actions minutes. Needs the Instabox
    # GitHub App installed on the repo; the free plan runs
    # instabox-medium only.
    runs-on: instabox-medium
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: npm
      - run: npm install -g npm@10.9.4
      - run: node --version && npm --version
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
