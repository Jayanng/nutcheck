name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: npm
      - run: npm install -g npm@10.9.4
      - run: node --version && npm --version
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
